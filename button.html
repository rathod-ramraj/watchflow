<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glossy Button</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Outfit', system-ui, sans-serif;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;

            width: 260px;
            height: 90px;

            text-decoration: none;
            color: #ffffff;

            font-family: 'Outfit', system-ui, sans-serif;
            font-size: 38px;
            font-weight: 300;
            letter-spacing: -0.2px;

            border-radius: 999px;

            background: linear-gradient(180deg,
                    #a78bfa 0%,
                    #8b5cf6 48%,
                    #6d28d9 100%);

            border: 2px solid #5b21b6;

            box-shadow:
                inset 0 2px 3px rgba(255, 255, 255, 0.9),
                inset 0 1px 1px rgba(255, 255, 255, 0.6),
                inset 0 -5px 12px rgba(76, 29, 149, 0.6),
                0 0 18px 2px rgba(139, 92, 246, 0.35);

            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            user-select: none;

            filter: drop-shadow(0 3px 6px rgba(46, 16, 101, 0.4));
        }

        /* top glossy highlight curve */

        .btn::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 4px;
            right: 4px;
            height: 46%;

            border-top-left-radius: 999px;
            border-top-right-radius: 999px;
            border-bottom-left-radius: 100% 35%;
            border-bottom-right-radius: 100% 35%;

            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.72) 0%,
                    rgba(255, 255, 255, 0.12) 80%,
                    rgba(255, 255, 255, 0) 100%);

            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.02);

            box-shadow:
                inset 0 2px 4px rgba(255, 255, 255, 0.95),
                inset 0 -5px 12px rgba(76, 29, 149, 0.6),
                0 0 22px 3px rgba(139, 92, 246, 0.5);
        }

        .btn:active {
            transform: translateY(1px) scale(0.98);

            box-shadow:
                inset 0 3px 6px rgba(0, 0, 0, 0.4),
                0 0 25px 2px rgba(139, 92, 246, 0.4);
        }

        .btn i,
        .btn span {
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 6px rgba(46, 16, 101, 0.5);
        }

        .btn i {
            font-size: 36px;
            transition: transform 0.3s ease;
        }

        .btn:hover i {
            transform: scale(1.06);
        }
    </style>
</head>

<body>

    <a href="#" class="btn">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

</body>

</html>
